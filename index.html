    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var ghRoute = params.get('gh_route');
        if (ghRoute && ghRoute.charAt(0) === '/' && ghRoute.charAt(1) !== '/') {

          window.history.replaceState(null, '', prefix + ghRoute);
        }
